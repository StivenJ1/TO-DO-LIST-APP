<ion-header  [translucent]="true" >
  <ion-toolbar class="bg-toolbar">
    <ion-title class="text-gray-blue-800 font-bold text-3xl text-center">
      ¡To Do List!
    </ion-title>
  </ion-toolbar>
</ion-header>


<ion-content class="bg-page" [fullscreen]="true">
  <div class="w-full h-full flex flex-col gap-5 p-5">
    <ion-button class="w-24 text-white font-bold bg-gray-blue-300 rounded-md border border-gray-blue-500 mt-5 ml-5" (click)="redirect()">
      Volver
    </ion-button>
    @if(categoryList().length === 0){
      <div class="w-full h-full flex flex-col items-center justify-center">
        <div class="text-xl font-bold text-center text-gray-blue-800">
          Inicia a gestionar tus tareas creando tus categorias
        </div>
        <img src="assets/images/i-logo-init-scroll.svg" />
        <div class="w-full h-9 flex justify-center items-center mt-0">
          <ion-button class="w-60 text-white font-bold bg-gray-blue-800 rounded-md border border-gray-blue-300" (click)="createModal()">
            Crear
          </ion-button>
        </div>
      </div>
      }@else {
        
        <div class="w-full h-full flex flex-col items-center">
          <div class="flex w-full items-start">
            <div class="text-xl font-bold text-gray-blue-800">
              Tu lista de categorias
            </div>
          </div>
          <div class="flex-[0.9] overflow-y-auto px-3 py-1 w-full mt-2">
            @for(category of categoryList(); track $index){
              <app-category-view [category]="category" (edit)="selectEditCategory(category)" />
            }
          </div>
        <div class="w-full h-9 flex justify-center items-center mt-0">
          <ion-button class="w-60 text-white font-bold bg-gray-blue-800 rounded-md border border-gray-blue-300 mt-3" (click)="createModal()">
            Crear
          </ion-button>
        </div>
        </div>
      }
  </div>
</ion-content>

<ion-modal [isOpen]="showModalCreate" class="custom-modal" (didDismiss)="showModalCreate = false">
  <ng-template>
    <div class="p-3 flex flex-col items-center justify-center">
      <div class="text-lg font-bold text-black">Crear categoria</div>
      <form [formGroup]="formCreate" class="w-full flex flex-col items-center gap-5 p-5">
        <ion-input formControlName="nameCategory" class="w-full text-black! font-bold bg-gray-blue-200 rounded-md border border-gray-blue-500 p-2!"
          placeholder="Nombre de la categoria"></ion-input>
        <div class="w-full h-9 flex justify-center items-center mt-0">
          <ion-button type="submit" class="w-60 text-white font-bold bg-gray-blue-800 rounded-md border border-gray-blue-300" (click)="createCategory()">
            Crear
          </ion-button>
        </div>
      </form>
    </div>
  </ng-template>
  
</ion-modal>

<ion-modal [isOpen]="showModalEdit" class="custom-modal" (didDismiss)="showModalEdit = false">
  <ng-template>
    <div class="p-3 flex flex-col items-center justify-center">
      <div class="text-lg font-bold text-black">Editar categoria</div>
      <form [formGroup]="formEdit" class="w-full flex flex-col items-center gap-5 p-5">
        <ion-input formControlName="nameCategory" class="w-full text-black! font-bold bg-gray-blue-200 rounded-md border border-gray-blue-500 p-2!"
          placeholder="Nombre de la categoria"></ion-input>
        <div class="w-full h-9 flex justify-center items-center mt-0">
          <ion-button type="submit" class="w-60 text-white font-bold bg-gray-blue-800 rounded-md border border-gray-blue-300" (click)="editCategory()">
            Editar
          </ion-button>
        </div>
      </form>
    </div>
  </ng-template>
  
</ion-modal>
