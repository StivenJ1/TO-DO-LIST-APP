workflows:
  ios-cordova-workflow:
    name: iOS Cordova Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.stiven.todolistapp
      vars:
        XCODE_WORKSPACE: "platforms/ios/YourApp.xcworkspace"
        XCODE_SCHEME: "MyApp"
      node: 20.9.0
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Ionic and Cordova CLI
        script: npm install -g @ionic/cli cordova

      - name: Add iOS platform
        script: |
          cordova platform add ios || true

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS app
        script: |
          cordova build ios --release
    artifacts:
      - platforms/ios/build/**/*.ipa
      - platforms/ios/build/**/*.xcarchive
    publishing:
      email:
        recipients:
          - sti50_jo@hotmail.com